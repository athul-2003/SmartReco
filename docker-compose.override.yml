# Auto-merged by `docker compose` whenever docker-compose.yml is (i.e. every
# `make up`/`make up-build`) — Compose loads this file automatically, no -f
# flag needed. This is the *local dev only* layer: it bind-mounts source code
# over the built image and turns on uvicorn's autoreload, so edits to
# app/**/*.py, templates, or static files take effect without a rebuild.
#
# Production runs should skip this file entirely: `make prod-up`/`make
# prod-build` pass `-f docker-compose.yml` explicitly, which excludes it.
services:
  app:
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
    command:
      [
        "uv", "run", "--no-sync", "uvicorn", "app.main:app",
        "--host", "0.0.0.0", "--port", "8000",
        "--reload", "--reload-dir", "/app/app",
      ]

  # Local-only SMTP catcher for testing the digest job's real "sent" path
  # without real credentials or spamming a real inbox (see docs/BUILD_PLAN.md,
  # Phase 6's email-delivery decision). Not part of docker-compose.yml itself
  # since it has no place in a production deploy - excluded automatically
  # whenever `make prod-*` runs with `-f docker-compose.yml` only.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI - view caught emails at http://localhost:8025
      - "1025:1025" # SMTP
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
