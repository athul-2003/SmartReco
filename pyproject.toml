[project]
name = "smartreco"
version = "0.1.0"
description = "SmartReco — a behavioral AI recommendation agent, powered by Mesh API"
requires-python = ">=3.11"
dependencies = [
    "bcrypt<4.1",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.10",
    "openai>=2.53.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.14,<1.16",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection relies on Depends(...)/Query(...)/etc. as default
# argument values - that's the correct pattern, not the mutable-default-arg bug B008
# checks for elsewhere.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]
