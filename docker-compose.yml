services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smartreco-app:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Compose-network topology overrides — not redundant with .env, and not
      # safe to remove. `.env`'s DATABASE_URL/QDRANT_URL are host-oriented
      # defaults (for anything run directly with `uv run` outside Docker, and
      # as documentation in .env.example). Inside this network, "localhost"
      # means the app container itself — not the qdrant container, and not a
      # path that lands in the /app/data bind mount — so these two must always
      # resolve to the in-network values below, regardless of what .env says.
      # Every other setting (MESH_API_KEY, SESSION_SECRET, CATALOG_LIMIT,
      # SMTP*, LANGCHAIN*) flows through from .env untouched.
      DATABASE_URL: sqlite:////app/data/smartreco.db
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    # Pinned (not :latest) for reproducibility, and to stay compatible with
    # the qdrant-client version pinned in pyproject.toml. Uses the official
    # prebuilt image — unlike `app`, there's no Dockerfile to build here.
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # No curl/wget in this image — bash's /dev/tcp is the lowest-dependency
      # way to hit Qdrant's own readiness endpoint from inside the container.
      # Must invoke bash explicitly: CMD-SHELL runs via /bin/sh (dash on this
      # image), which doesn't support /dev/tcp - only bash does.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
