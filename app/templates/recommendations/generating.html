{% extends "base.html" %}
{% block title %}My Recommendations — SmartReco{% endblock %}
{% block content %}
<div class="admin-header">
  <div>
    <span class="section-eyebrow">Personalized for you</span>
    <h1>My Recommendations</h1>
    <p class="recommendation-meta">Finding the best-fit courses for you&hellip;</p>
  </div>
</div>

<div class="narrative-card">
  <div class="narrative-icon">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </div>
  <div class="narrative-body">
    <span class="chip">Why these courses</span>
    <p id="narrative-text" class="narrative-loading">Thinking about what fits you best&hellip;</p>
  </div>
</div>

<div id="product-grid-container" class="generating-placeholder">
  <span class="spinner" aria-hidden="true"></span>
  <p>Finding your best-fit courses&hellip;</p>
</div>

<script src="/static/js/recommendations-generate.js" data-trigger-reason="{{ trigger_reason }}" defer></script>
{% endblock %}
