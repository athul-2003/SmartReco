{% extends "base.html" %}
{% block title %}{{ "Edit" if mode == "edit" else "New" }} Course — SmartReco Admin{% endblock %}
{% block content %}
<p><a href="/admin/products">&larr; Back to courses</a></p>
<h1>{{ "Edit" if mode == "edit" else "New" }} Course</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<div class="admin-card" style="max-width: 480px;">
  <form
    action="{{ '/admin/products/%d/edit'|format(product.id) if mode == 'edit' else '/admin/products/new' }}"
    method="post"
    class="auth-form"
  >
    <label>Title
      <input type="text" name="title" required value="{{ product.title if product else '' }}">
    </label>
    <label>Description
      <textarea name="description" rows="4" required>{{ product.description if product else '' }}</textarea>
    </label>
    <label>Category
      <select name="category" required>
        <option value="" {% if not product %}selected{% endif %} disabled>Select a category&hellip;</option>
        {% for c in categories %}
        <option value="{{ c }}" {% if product and product.category == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </label>
    <label>Price
      <input type="number" name="price" step="0.01" min="0" value="{{ product.price if product else 0 }}">
    </label>
    <button type="submit" class="btn btn-primary">{{ "Save" if mode == "edit" else "Create" }}</button>
  </form>
</div>
{% endblock %}
