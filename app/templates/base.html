<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SmartReco{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  {% if user %}
  <nav class="site-nav">
    <a href="/" class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2 3 7l9 5 9-5-9-5Z" fill="currentColor" opacity="0.9"/><path d="M3 12l9 5 9-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 17l9 5 9-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/></svg>
      </span>
      SmartReco
    </a>
    <div class="nav-links">
      <a href="/catalog">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
        Catalog
      </a>
      <a href="/recommendations">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.5 14.4 9l6.9.2-5.5 4.3 2 6.7-5.8-4-5.8 4 2-6.7-5.5-4.3L9.6 9 12 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        My Recommendations
      </a>
      {% if user.role.value == "admin" %}
      <a href="/admin">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V5l-8-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Admin
      </a>
      {% endif %}
      <span class="nav-user">
        <span class="nav-avatar">{{ user.email[0]|upper }}</span>
        {{ user.email }}
      </span>
      <form action="/logout" method="post" class="inline-form">
        <button type="submit">Logout</button>
      </form>
    </div>
  </nav>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    &copy; 2026 SmartReco. Built for the SmartReco Build Challenge.
  </footer>
  {% if user %}<script src="/static/js/tracker.js" defer></script>{% endif %}
</body>
</html>
