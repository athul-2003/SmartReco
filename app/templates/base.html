<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SmartReco{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav>
    <a href="/" class="brand">SmartReco</a>
    <div class="nav-links">
      <a href="/catalog">Catalog</a>
      {% if user %}
        <span class="nav-user">{{ user.email }}{% if user.role.value == "admin" %} · admin{% endif %}</span>
        {% if user.role.value == "admin" %}<a href="/admin">Admin</a>{% endif %}
        <form action="/logout" method="post" class="inline-form">
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="/login">Login</a>
        <a href="/register">Register</a>
      {% endif %}
    </div>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
